<svg width="100%" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" rx="14" fill="url(#bgGrad)"/>
  <rect width="1200" height="220" rx="14" fill="url(#grid)"/>

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Decorative Glow Circles -->
  <circle cx="1050" cy="60" r="90" fill="#38bdf8" opacity="0.06"/>
  <circle cx="150" cy="170" r="80" fill="#818cf8" opacity="0.06"/>

  <!-- Terminal Prompt Badge -->
  <rect x="60" y="42" width="215" height="28" rx="14" fill="#1f2937" stroke="#30363d" stroke-width="1"/>
  <circle cx="78" cy="56" r="4.5" fill="#34d399"/>
  <text x="92" y="60" fill="#9ca3af" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="600">~/patelprem123 • mumbai</text>

  <!-- Main Name -->
  <text x="60" y="122" fill="#f9fafb" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="2">
    PREM PATEL
  </text>

  <!-- Subtitle -->
  <text x="62" y="158" fill="url(#accentGrad)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="0.5">
    Computer Engineering Student  •  IT Infrastructure &amp; Full-Stack Web Developer
  </text>

  <!-- Bottom Tags -->
  <text x="62" y="190" fill="#8b949e" font-family="Consolas, 'Courier New', monospace" font-size="13">
    MERN Stack  |  Linux &amp; Windows  |  CCNA Networking  |  ITSM (ServiceNow / Zoho Desk)
  </text>
</svg>
